<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PetCare Pro</title><style>
:root{--navy:#0f172a;--navy2:#162033;--blue:#2563eb;--bg:#f5f7fb;--line:#e5e7eb;--muted:#64748b;--text:#0f172a;--white:#fff;--danger:#dc2626}*{box-sizing:border-box}body{margin:0;font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text)}button,input,select{font:inherit}.hidden{display:none!important}.login{min-height:100vh;display:grid;grid-template-columns:1.1fr .9fr;background:linear-gradient(135deg,#0b1220,#14233c)}.hero{padding:8vw;color:#fff;display:flex;flex-direction:column;justify-content:center}.hero h1{font-size:clamp(36px,5vw,68px);line-height:1.05;margin:18px 0}.hero p{max-width:620px;color:#cbd5e1;font-size:18px;line-height:1.8}.kicker{font-size:12px;letter-spacing:2px;color:#93c5fd}.login-side{display:grid;place-items:center;padding:28px}.card-login{width:min(460px,94vw);background:#fff;border-radius:22px;padding:34px;box-shadow:0 30px 80px #0004}.brand{display:flex;align-items:center;gap:12px;font-size:22px;font-weight:800}.brandmark{width:42px;height:42px;display:grid;place-items:center;border-radius:12px;background:#dbeafe}.field{display:grid;gap:7px;margin-top:18px}.field label{font-size:13px;font-weight:700;color:#334155}.field input,.field select{width:100%;border:1px solid #dbe2ea;border-radius:10px;padding:12px 13px;background:#fff}.btn{border:0;border-radius:10px;padding:11px 15px;cursor:pointer;font-weight:700}.primary{background:var(--blue);color:white}.secondary{background:#eef2f7;color:#334155}.danger{background:#fee2e2;color:#b91c1c}.login-actions{display:flex;gap:10px;margin-top:22px}.msg{margin-top:14px;color:#b91c1c;font-size:14px}.shell{display:grid;grid-template-columns:250px 1fr;min-height:100vh}.side{background:var(--navy);color:white;padding:22px 16px;position:sticky;top:0;height:100vh}.side .brand{padding:0 8px 22px;border-bottom:1px solid #ffffff14}.nav{display:grid;gap:6px;margin-top:22px}.nav button{border:0;background:transparent;color:#cbd5e1;text-align:left;padding:12px 14px;border-radius:10px;cursor:pointer}.nav button.active,.nav button:hover{background:#2563eb;color:white}.main{min-width:0}.topbar{height:76px;background:white;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:5}.topbar h1{font-size:22px;margin:0}.topbar small{color:var(--muted)}.content{padding:26px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.stat,.panel{background:white;border:1px solid #e6eaf0;border-radius:14px;box-shadow:0 4px 14px #0f172a0b}.stat{padding:22px}.stat b{font-size:30px;display:block;margin-top:8px}.panel{padding:20px;margin-top:18px}.toolbar{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-bottom:16px}.toolbar .left{display:flex;gap:10px;align-items:center}.search{border:1px solid #dbe2ea;border-radius:9px;padding:10px 12px;width:min(280px,45vw)}table{width:100%;border-collapse:collapse}th,td{padding:13px 10px;border-bottom:1px solid #edf0f4;text-align:left;font-size:14px}th{color:#475569;background:#f8fafc}.actions{display:flex;gap:7px}.tag{display:inline-block;padding:4px 9px;border-radius:999px;background:#e0ecff;color:#1d4ed8;font-size:12px}.empty{text-align:center;color:#94a3b8;padding:32px}.modal-bg{position:fixed;inset:0;background:#0f172a88;display:grid;place-items:center;padding:20px;z-index:20}.modal{width:min(560px,96vw);background:#fff;border-radius:16px;padding:22px}.modal h3{margin:0 0 16px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.modal-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:20px}.mobile{display:none}.hamb{display:none}@media(max-width:900px){.login{grid-template-columns:1fr}.hero{display:none}.shell{grid-template-columns:1fr}.side{position:fixed;left:-260px;z-index:15;width:250px;transition:.2s}.side.open{left:0}.hamb{display:inline-flex}.stats{grid-template-columns:1fr 1fr}.content{padding:16px}.topbar{padding:0 16px}.toolbar{align-items:flex-start;flex-direction:column}.toolbar .left{width:100%}.search{width:100%}.panel{overflow:auto}}@media(max-width:560px){.stats{grid-template-columns:1fr}.grid2{grid-template-columns:1fr}.login-side{padding:14px}.card-login{padding:24px}th,td{white-space:nowrap}}
</style></head><body>
<div id="login" class="login"><section class="hero"><span class="kicker">PETCARE BUSINESS CONSOLE</span><h1>宠物门店运营<br>一站式管理</h1><p>整合宠物档案、客户资料、洗护项目、寄养记录与服务订单。商务化界面，支持电脑、平板和手机访问。</p></section><section class="login-side"><div class="card-login"><div class="brand"><div class="brandmark">🐾</div>PetCare Pro</div><h2>欢迎回来</h2><p style="color:#64748b">登录后进入门店业务控制台</p><div class="field"><label>用户名</label><input id="username" placeholder="请输入用户名"></div><div class="field"><label>密码</label><input id="password" type="password" placeholder="请输入密码"></div><div class="login-actions"><button class="btn primary" onclick="login()">登录</button><button class="btn secondary" onclick="registerUser()">注册账号</button></div><div id="loginMsg" class="msg"></div></div></section></div>
<div id="app" class="shell hidden"><aside id="side" class="side"><div class="brand"><div class="brandmark">🐾</div><span>PetCare Pro</span></div><nav id="nav" class="nav"></nav></aside><main class="main"><header class="topbar"><div style="display:flex;align-items:center;gap:12px"><button class="btn secondary hamb" onclick="side.classList.toggle('open')">☰</button><div><h1 id="pageTitle">运营概览</h1><small id="pageSub">查看门店核心业务数据</small></div></div><div style="display:flex;align-items:center;gap:10px"><span id="who" style="font-weight:700"></span><button class="btn secondary" onclick="logout()">退出</button></div></header><section id="content" class="content"></section></main></div>
<div id="modal" class="modal-bg hidden" onclick="if(event.target===this)closeModal()"><div class="modal"><h3 id="modalTitle"></h3><div id="modalBody"></div><div class="modal-actions"><button class="btn secondary" onclick="closeModal()">取消</button><button class="btn primary" id="modalSave">保存</button></div></div></div>
<script>
const modules={pet:{label:'宠物管理',sub:'维护宠物基本档案与信息',api:'/api/pets',cols:[['id','编号'],['name','名称'],['age','年龄'],['breed','品种'],['gender','性别'],['weight','体重']],fields:[['id','宠物编号'],['name','宠物名称'],['age','年龄','number'],['breed','品种'],['gender','性别'],['weight','体重','number']]},customer:{label:'客户管理',sub:'维护客户联系资料',api:'/api/customers',cols:[['id','编号'],['name','姓名'],['phone','电话'],['address','地址']],fields:[['id','客户编号'],['name','客户姓名'],['phone','电话'],['address','地址']]},wash:{label:'洗护管理',sub:'配置洗护服务、价格与时长',api:'/api/washes',cols:[['id','编号'],['name','项目名称'],['price','价格'],['time','时长']],fields:[['id','项目编号'],['name','项目名称'],['price','价格','number'],['time','服务时长']]},boarding:{label:'寄养管理',sub:'登记寄养时间、费用与状态',api:'/api/boardings',cols:[['id','编号'],['petId','宠物编号'],['startDate','开始时间'],['endDate','结束时间'],['pricePerDay','每日价格'],['status','状态']],fields:[['id','寄养编号'],['petId','宠物编号'],['startDate','开始时间','datetime-local'],['endDate','结束时间','datetime-local'],['pricePerDay','每日价格','number'],['status','状态']]},order:{label:'服务订单',sub:'统一管理服务订单与进度',api:'/api/orders',cols:[['id','订单编号'],['petId','宠物编号'],['serviceType','服务类型'],['price','金额'],['createTime','创建时间'],['status','状态']],fields:[['id','订单编号'],['petId','宠物编号'],['serviceType','服务类型'],['price','金额','number'],['createTime','创建时间','datetime-local'],['status','状态']]}};
let current='dashboard',cache=[];const navItems=[['dashboard','运营概览'],['pet','宠物管理'],['customer','客户管理'],['wash','洗护管理'],['boarding','寄养管理'],['order','服务订单']];
const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
async function api(url,opt={}){const r=await fetch(url,{credentials:'include',headers:{'Content-Type':'application/json',...(opt.headers||{})},...opt});if(r.status===401){showLogin();throw Error('请重新登录')}if(!r.ok)throw Error(await r.text()||'操作失败');const t=await r.text();return t?JSON.parse(t):null}
async function boot(){try{const me=await api('/api/auth/me');who.textContent=me.name;showApp();renderNav();go('dashboard')}catch{showLogin()}}
function showLogin(){login.classList.remove('hidden');app.classList.add('hidden')}function showApp(){login.classList.add('hidden');app.classList.remove('hidden')}
async function login(){loginMsg.textContent='';try{const r=await api('/api/auth/login',{method:'POST',body:JSON.stringify({name:username.value,password:password.value})});who.textContent=r.name;showApp();renderNav();go('dashboard')}catch(e){loginMsg.textContent='用户名或密码错误'}}
async function registerUser(){loginMsg.textContent='';try{await api('/api/auth/register',{method:'POST',body:JSON.stringify({name:username.value,password:password.value})});loginMsg.style.color='#15803d';loginMsg.textContent='注册成功，请点击登录'}catch(e){loginMsg.style.color='#b91c1c';loginMsg.textContent=e.message}}
async function logout(){await fetch('/api/auth/logout',{method:'POST',credentials:'include'});showLogin()}
function renderNav(){nav.innerHTML=navItems.map(([k,l])=>`<button class="${current===k?'active':''}" onclick="go('${k}')">${l}</button>`).join('')}
async function go(k){current=k;side.classList.remove('open');renderNav();if(k==='dashboard'){pageTitle.textContent='运营概览';pageSub.textContent='查看门店核心业务数据';const d=await api('/api/dashboard');content.innerHTML=`<div class="stats">${[['宠物档案',d.pets],['客户数量',d.customers],['寄养中',d.boardings],['服务订单',d.orders]].map(x=>`<div class="stat"><span style="color:#64748b">${x[0]}</span><b>${x[1]}</b></div>`).join('')}</div><div class="panel"><h3>业务快捷入口</h3><p style="color:#64748b">通过左侧导航进入各业务模块，支持新增、查询、修改和删除。</p></div>`;return}const m=modules[k];pageTitle.textContent=m.label;pageSub.textContent=m.sub;cache=await api(m.api);renderTable()}
function renderTable(){const m=modules[current];content.innerHTML=`<div class="panel"><div class="toolbar"><div class="left"><input id="search" class="search" placeholder="搜索当前列表" oninput="filterTable()"><button class="btn primary" onclick="openEdit()">＋ 新增</button></div><span style="color:#64748b">共 ${cache.length} 条</span></div><div id="tableWrap"></div></div>`;draw(cache)}
function filterTable(){const q=search.value.toLowerCase();draw(cache.filter(x=>JSON.stringify(x).toLowerCase().includes(q)))}
function draw(list){const m=modules[current];tableWrap.innerHTML=list.length?`<table><thead><tr>${m.cols.map(c=>`<th>${c[1]}</th>`).join('')}<th>操作</th></tr></thead><tbody>${list.map(x=>`<tr>${m.cols.map(c=>`<td>${esc(x[c[0]])}</td>`).join('')}<td class="actions"><button class="btn secondary" onclick='openEdit(${JSON.stringify(x).replace(/'/g,"&#39;")})'>编辑</button><button class="btn danger" onclick="removeItem('${esc(x.id)}')">删除</button></td></tr>`).join('')}</tbody></table>`:`<div class="empty">暂无数据</div>`}
function openEdit(data=null){const m=modules[current];modalTitle.textContent=data?`编辑${m.label}`:`新增${m.label}`;modalBody.innerHTML=`<div class="grid2">${m.fields.map(([k,l,t='text'])=>`<div class="field"><label>${l}</label><input data-k="${k}" type="${t}" value="${esc(data?.[k]??'')}" ${data&&k==='id'?'disabled':''}></div>`).join('')}</div>`;modal.classList.remove('hidden');modalSave.onclick=()=>saveItem(data?.id)}
function closeModal(){modal.classList.add('hidden')}
async function saveItem(id){const m=modules[current],d={};modalBody.querySelectorAll('[data-k]').forEach(i=>d[i.dataset.k]=i.value);try{await api(id?`${m.api}/${encodeURIComponent(id)}`:m.api,{method:id?'PUT':'POST',body:JSON.stringify(d)});closeModal();go(current)}catch(e){alert(e.message)}}
async function removeItem(id){if(!confirm('确定删除这条记录吗？'))return;try{await api(`${modules[current].api}/${encodeURIComponent(id)}`,{method:'DELETE'});go(current)}catch(e){alert(e.message)}}
boot();
</script></body></html>
