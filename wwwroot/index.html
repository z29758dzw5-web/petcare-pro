<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PetCare Pro</title>
<style>
:root{--navy:#0f172a;--blue:#2563eb;--blue2:#1d4ed8;--bg:#f6f8fc;--line:#e2e8f0;--muted:#64748b;--text:#0f172a;--white:#fff;--danger:#dc2626;--ok:#15803d}
*{box-sizing:border-box}body{margin:0;font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text)}button,input,select{font:inherit}.hidden{display:none!important}.login{min-height:100vh;display:grid;grid-template-columns:1.05fr .95fr;background:linear-gradient(135deg,#0b1220,#172554)}.hero{padding:8vw;color:#fff;display:flex;flex-direction:column;justify-content:center}.hero h1{font-size:clamp(36px,5vw,66px);line-height:1.08;margin:18px 0}.hero p{max-width:620px;color:#cbd5e1;font-size:18px;line-height:1.8}.kicker{font-size:12px;letter-spacing:2px;color:#93c5fd}.login-side{display:grid;place-items:center;padding:28px}.card-login{width:min(460px,94vw);background:#fff;border-radius:20px;padding:34px;box-shadow:0 30px 80px #0004}.brand{display:flex;align-items:center;gap:12px;font-size:21px;font-weight:800}.brandmark{width:42px;height:42px;display:grid;place-items:center;border-radius:12px;background:#dbeafe}.field{display:grid;gap:7px;margin-top:15px}.field label{font-size:13px;font-weight:700;color:#334155}.field input,.field select{width:100%;border:1px solid #cbd5e1;border-radius:10px;padding:12px 13px;background:#fff;outline:none}.field input:focus,.field select:focus{border-color:#2563eb;box-shadow:0 0 0 3px #2563eb18}.btn{border:0;border-radius:10px;padding:10px 14px;cursor:pointer;font-weight:700}.primary{background:var(--blue);color:white}.primary:hover{background:var(--blue2)}.secondary{background:#eef2f7;color:#334155}.danger{background:#fee2e2;color:#b91c1c}.login-actions{display:flex;gap:10px;margin-top:22px}.msg{margin-top:14px;color:#b91c1c;font-size:14px}.shell{display:grid;grid-template-columns:250px 1fr;min-height:100vh}.side{background:var(--navy);color:white;padding:22px 16px;position:sticky;top:0;height:100vh}.side .brand{padding:0 8px 22px;border-bottom:1px solid #ffffff14}.nav{display:grid;gap:6px;margin-top:22px}.nav button{border:0;background:transparent;color:#cbd5e1;text-align:left;padding:12px 14px;border-radius:10px;cursor:pointer}.nav button.active,.nav button:hover{background:#2563eb;color:white}.main{min-width:0}.topbar{height:76px;background:white;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:5}.topbar h1{font-size:22px;margin:0}.topbar small{color:var(--muted)}.content{padding:26px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.stat,.panel{background:white;border:1px solid #e6eaf0;border-radius:14px;box-shadow:0 4px 14px #0f172a0b}.stat{padding:22px}.stat b{font-size:30px;display:block;margin-top:8px}.panel{padding:20px;margin-top:18px}.toolbar{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-bottom:16px}.toolbar .left{display:flex;gap:10px;align-items:center}.search{border:1px solid #dbe2ea;border-radius:9px;padding:10px 12px;width:min(300px,48vw)}table{width:100%;border-collapse:collapse}th,td{padding:13px 10px;border-bottom:1px solid #edf0f4;text-align:left;font-size:14px}th{color:#475569;background:#f8fafc}.actions{display:flex;gap:7px}.empty{text-align:center;color:#94a3b8;padding:32px}.modal-bg{position:fixed;inset:0;background:#0f172a88;display:grid;place-items:center;padding:20px;z-index:20}.modal{width:min(620px,96vw);max-height:90vh;overflow:auto;background:#fff;border-radius:16px;padding:22px}.modal h3{margin:0 0 6px}.modal-sub{color:#64748b;font-size:13px;margin-bottom:14px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.modal-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:20px}.hamb{display:none}.pet-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.pet-card{border:1px solid #e2e8f0;border-radius:14px;padding:16px;background:#fff}.pet-card h4{margin:0 0 6px;font-size:17px}.pet-meta{font-size:13px;color:#64748b;line-height:1.7;margin-bottom:12px}.pet-actions{display:flex;gap:8px;flex-wrap:wrap}.section-title{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}.section-title h3{margin:0}.badge{display:inline-flex;align-items:center;padding:4px 8px;border-radius:999px;background:#eff6ff;color:#1d4ed8;font-size:12px;font-weight:700}.notice{padding:12px 14px;background:#eff6ff;border:1px solid #bfdbfe;border-radius:10px;color:#1e40af;font-size:13px;margin-bottom:14px}
@media(max-width:1100px){.pet-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:900px){.login{grid-template-columns:1fr}.hero{display:none}.shell{grid-template-columns:1fr}.side{position:fixed;left:-260px;z-index:15;width:250px;transition:.2s}.side.open{left:0}.hamb{display:inline-flex}.stats{grid-template-columns:1fr 1fr}.content{padding:16px}.topbar{padding:0 16px}.toolbar{align-items:flex-start;flex-direction:column}.toolbar .left{width:100%;flex-wrap:wrap}.search{width:100%}.panel{overflow:auto}}
@media(max-width:560px){.stats,.pet-grid,.grid2{grid-template-columns:1fr}.login-side{padding:14px}.card-login{padding:24px}th,td{white-space:nowrap}}
</style>
</head>
<body>
<div id="login" class="login"><section class="hero"><span class="kicker">PETCARE BUSINESS CONSOLE</span><h1>宠物门店运营<br>一站式管理</h1><p>宠物档案、客户资料、洗护、寄养与服务订单自动联动，让门店日常操作更接近真实业务系统。</p></section><section class="login-side"><div class="card-login"><div class="brand"><div class="brandmark">🐾</div>PetCare Pro</div><h2>欢迎回来</h2><p style="color:#64748b">登录后进入门店业务控制台</p><div class="field"><label>用户名</label><input id="username" placeholder="例如：store_admin"></div><div class="field"><label>密码</label><input id="password" type="password" placeholder="请输入密码"></div><div class="login-actions"><button class="btn primary" onclick="doLogin()">登录</button><button class="btn secondary" onclick="registerUser()">注册账号</button></div><div id="loginMsg" class="msg"></div></div></section></div>
<div id="app" class="shell hidden"><aside id="side" class="side"><div class="brand"><div class="brandmark">🐾</div><span>PetCare Pro</span></div><nav id="nav" class="nav"></nav></aside><main class="main"><header class="topbar"><div style="display:flex;align-items:center;gap:12px"><button class="btn secondary hamb" onclick="side.classList.toggle('open')">☰</button><div><h1 id="pageTitle">运营概览</h1><small id="pageSub">查看门店核心业务数据</small></div></div><div style="display:flex;align-items:center;gap:10px"><span id="who" style="font-weight:700"></span><button class="btn secondary" onclick="logout()">退出</button></div></header><section id="content" class="content"></section></main></div>
<div id="modal" class="modal-bg hidden" onclick="if(event.target===this)closeModal()"><div class="modal"><h3 id="modalTitle"></h3><div id="modalSub" class="modal-sub"></div><div id="modalBody"></div><div class="modal-actions"><button class="btn secondary" onclick="closeModal()">取消</button><button class="btn primary" id="modalSave">保存</button></div></div></div>
<script>
const navItems=[['dashboard','运营概览'],['pet','宠物管理'],['customer','客户管理'],['wash','洗护管理'],['boarding','寄养管理'],['order','服务订单']];
let current='dashboard',cache=[],pets=[];
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
async function api(url,opt={}){const r=await fetch(url,{credentials:'include',headers:{'Content-Type':'application/json',...(opt.headers||{})},...opt});if(r.status===401){showLogin();throw Error('请重新登录')}if(!r.ok)throw Error((await r.text()).replace(/^"|"$/g,'')||'操作失败');const t=await r.text();return t?JSON.parse(t):null}
async function refreshPets(){pets=await api('/api/pets')}
async function boot(){try{const me=await api('/api/auth/me');who.textContent=me.name;showApp();renderNav();await refreshPets();await go('dashboard')}catch{showLogin()}}
function showLogin(){login.classList.remove('hidden');app.classList.add('hidden')}function showApp(){login.classList.add('hidden');app.classList.remove('hidden')}
async function doLogin(){loginMsg.textContent='';try{const r=await api('/api/auth/login',{method:'POST',body:JSON.stringify({name:username.value,password:password.value})});who.textContent=r.name;showApp();renderNav();await refreshPets();await go('dashboard')}catch(e){loginMsg.style.color='#b91c1c';loginMsg.textContent='用户名或密码错误'}}
async function registerUser(){loginMsg.textContent='';try{await api('/api/auth/register',{method:'POST',body:JSON.stringify({name:username.value,password:password.value})});loginMsg.style.color='#15803d';loginMsg.textContent='注册成功，请点击登录'}catch(e){loginMsg.style.color='#b91c1c';loginMsg.textContent=e.message}}
async function logout(){await fetch('/api/auth/logout',{method:'POST',credentials:'include'});showLogin()}
function renderNav(){nav.innerHTML=navItems.map(([k,l])=>`<button class="${current===k?'active':''}" onclick="go('${k}')">${l}</button>`).join('')}
async function go(k){current=k;side.classList.remove('open');renderNav();if(k==='dashboard'){pageTitle.textContent='运营概览';pageSub.textContent='查看门店核心业务数据';const d=await api('/api/dashboard');content.innerHTML=`<div class="stats">${[['宠物档案',d.pets],['客户数量',d.customers],['寄养中',d.boardings],['服务订单',d.orders]].map(x=>`<div class="stat"><span style="color:#64748b">${x[0]}</span><b>${x[1]}</b></div>`).join('')}</div><div class="panel"><h3>业务联动</h3><p style="color:#64748b;line-height:1.8">新增宠物后，会直接出现在洗护和寄养页面的“可服务宠物”区域。点击宠物卡片上的按钮即可新增项目；新增洗护或寄养后，会自动生成服务订单。</p></div>`;return}
if(k==='pet'){pageTitle.textContent='宠物管理';pageSub.textContent='维护宠物档案，并同步给洗护与寄养使用';cache=await api('/api/pets');pets=cache;renderPetTable();return}
if(k==='wash'){pageTitle.textContent='洗护管理';pageSub.textContent='所有宠物自动同步到此页面，可直接选择宠物添加洗护';await refreshPets();cache=await api('/api/washes');renderServicePage('wash');return}
if(k==='boarding'){pageTitle.textContent='寄养管理';pageSub.textContent='所有宠物自动同步到此页面，可直接选择宠物添加寄养';await refreshPets();cache=await api('/api/boardings');renderServicePage('boarding');return}
if(k==='customer'){pageTitle.textContent='客户管理';pageSub.textContent='维护客户联系资料';cache=await api('/api/customers');renderSimpleTable('customer');return}
if(k==='order'){pageTitle.textContent='服务订单';pageSub.textContent='洗护和寄养新增后自动进入订单列表';cache=await api('/api/orders');renderSimpleTable('order');return}}
function petCards(kind){if(!pets.length)return `<div class="empty">还没有宠物档案，请先到“宠物管理”新增宠物。</div>`;return `<div class="pet-grid">${pets.map(p=>`<div class="pet-card"><div class="section-title"><h4>${esc(p.name)}</h4><span class="badge">${esc(p.id)}</span></div><div class="pet-meta">品种：${esc(p.breed||'未填写')}<br>性别：${esc(p.gender||'未填写')} · 年龄：${esc(p.age??'未填写')} · 体重：${esc(p.weight??'未填写')} kg</div><div class="pet-actions"><button class="btn primary" onclick="openService('${kind}','${esc(p.id)}')">${kind==='wash'?'＋ 添加洗护':'＋ 添加寄养'}</button></div></div>`).join('')}</div>`}
function renderServicePage(kind){const title=kind==='wash'?'可服务宠物':'可寄养宠物';const cols=kind==='wash'?[['id','编号'],['petName','宠物'],['name','洗护项目'],['price','价格'],['time','预计时长']]:[['id','编号'],['petName','宠物'],['startDate','开始时间'],['endDate','结束时间'],['pricePerDay','每日价格'],['status','状态']];content.innerHTML=`<div class="panel"><div class="section-title"><div><h3>${title}</h3><div style="color:#64748b;font-size:13px;margin-top:5px">这里会自动同步宠物管理中新增的全部宠物</div></div><span class="badge">共 ${pets.length} 只</span></div>${petCards(kind)}</div><div class="panel"><div class="toolbar"><div class="left"><input id="search" class="search" placeholder="搜索已有记录" oninput="filterService('${kind}')"><button class="btn secondary" onclick="openService('${kind}')">＋ 手动新增</button></div><span style="color:#64748b">已有 ${cache.length} 条记录</span></div><div id="tableWrap"></div></div>`;drawTable(cache,cols,kind)}
function filterService(kind){const q=search.value.toLowerCase();const cols=kind==='wash'?[['id','编号'],['petName','宠物'],['name','洗护项目'],['price','价格'],['time','预计时长']]:[['id','编号'],['petName','宠物'],['startDate','开始时间'],['endDate','结束时间'],['pricePerDay','每日价格'],['status','状态']];drawTable(cache.filter(x=>JSON.stringify(x).toLowerCase().includes(q)),cols,kind)}
function renderPetTable(){const cols=[['id','编号'],['name','名称'],['age','年龄'],['breed','品种'],['gender','性别'],['weight','体重(kg)']];content.innerHTML=`<div class="panel"><div class="toolbar"><div class="left"><input id="search" class="search" placeholder="搜索宠物" oninput="filterPet()"><button class="btn primary" onclick="openPet()">＋ 新增宠物</button></div><span style="color:#64748b">共 ${cache.length} 只</span></div><div id="tableWrap"></div></div>`;drawTable(cache,cols,'pet')}
function filterPet(){const q=search.value.toLowerCase();drawTable(cache.filter(x=>JSON.stringify(x).toLowerCase().includes(q)),[['id','编号'],['name','名称'],['age','年龄'],['breed','品种'],['gender','性别'],['weight','体重(kg)']],'pet')}
function renderSimpleTable(kind){const cols=kind==='customer'?[['id','编号'],['name','姓名'],['phone','电话'],['address','地址']]:[['id','订单编号'],['petName','宠物'],['serviceType','服务类型'],['price','金额'],['createTime','创建时间'],['status','状态']];content.innerHTML=`<div class="panel"><div class="toolbar"><div class="left"><input id="search" class="search" placeholder="搜索当前列表" oninput="filterSimple('${kind}')"><button class="btn primary" onclick="openSimple('${kind}')">＋ 新增</button></div><span style="color:#64748b">共 ${cache.length} 条</span></div><div id="tableWrap"></div></div>`;drawTable(cache,cols,kind)}
function filterSimple(kind){const q=search.value.toLowerCase();const cols=kind==='customer'?[['id','编号'],['name','姓名'],['phone','电话'],['address','地址']]:[['id','订单编号'],['petName','宠物'],['serviceType','服务类型'],['price','金额'],['createTime','创建时间'],['status','状态']];drawTable(cache.filter(x=>JSON.stringify(x).toLowerCase().includes(q)),cols,kind)}
function drawTable(list,cols,kind){tableWrap.innerHTML=list.length?`<table><thead><tr>${cols.map(c=>`<th>${c[1]}</th>`).join('')}<th>操作</th></tr></thead><tbody>${list.map(x=>`<tr>${cols.map(c=>`<td>${esc(x[c[0]]??'')}</td>`).join('')}<td class="actions"><button class="btn secondary" onclick='editRow("${kind}",${JSON.stringify(x).replace(/'/g,"&#39;")})'>编辑</button><button class="btn danger" onclick="removeRow('${kind}','${esc(x.id)}')">删除</button></td></tr>`).join('')}</tbody></table>`:`<div class="empty">暂无记录</div>`}
function petSelect(value=''){return `<select data-k="petId"><option value="">请选择宠物</option>${pets.map(p=>`<option value="${esc(p.id)}" ${p.id===value?'selected':''}>${esc(p.name)}（${esc(p.id)} · ${esc(p.breed||'未填品种')}）</option>`).join('')}</select>`}
function fld(label,key,value='',type='text',placeholder=''){return `<div class="field"><label>${label}</label><input data-k="${key}" type="${type}" value="${esc(value)}" placeholder="${esc(placeholder)}"></div>`}
function getData(){const d={};modalBody.querySelectorAll('[data-k]').forEach(i=>d[i.dataset.k]=i.value);return d}
function openPet(data=null){modal.classList.remove('hidden');modalTitle.textContent=data?'编辑宠物档案':'新增宠物档案';modalSub.textContent='保存后会自动同步到洗护和寄养页面';modalBody.innerHTML=`<div class="grid2">${fld('宠物编号','id',data?.id||'','text','例如：PET001')}${fld('宠物名称','name',data?.name||'','text','例如：豆豆')}${fld('年龄','age',data?.age??'','number','例如：3')}<div class="field"><label>品种</label><input data-k="breed" list="breedList" value="${esc(data?.breed||'')}" placeholder="选择常用品种或自己输入"><datalist id="breedList"><option>泰迪</option><option>比熊</option><option>金毛</option><option>拉布拉多</option><option>柯基</option><option>柴犬</option><option>博美</option><option>边牧</option><option>英短</option><option>美短</option><option>布偶</option><option>中华田园猫</option></datalist></div><div class="field"><label>性别</label><select data-k="gender"><option value="">请选择公母</option><option ${data?.gender==='公'?'selected':''}>公</option><option ${data?.gender==='母'?'selected':''}>母</option><option ${data?.gender==='未知'?'selected':''}>未知</option></select></div>${fld('体重(kg)','weight',data?.weight??'','number','例如：6.5')}</div>`;if(data)modalBody.querySelector('[data-k="id"]').disabled=true;modalSave.onclick=async()=>{const d=getData();await api(data?`/api/pets/${encodeURIComponent(data.id)}`:'/api/pets',{method:data?'PUT':'POST',body:JSON.stringify(d)});closeModal();await go('pet')}}
function openService(kind,petId='',data=null){modal.classList.remove('hidden');modalTitle.textContent=kind==='wash'?(data?'编辑洗护记录':'新增洗护项目'):(data?'编辑寄养记录':'新增寄养记录');modalSub.textContent='宠物来源于宠物管理，保存后会自动联动服务订单';if(kind==='wash'){modalBody.innerHTML=`<div class="grid2">${fld('洗护编号','id',data?.id||'','text','例如：W001')}<div class="field"><label>宠物</label>${petSelect(data?.petId||petId)}</div>${fld('洗护项目','name',data?.name||'','text','例如：基础洗护')}${fld('价格','price',data?.price??'','number','例如：88')}${fld('预计时长','time',data?.time||'','text','例如：60分钟')}</div>`}else{modalBody.innerHTML=`<div class="grid2">${fld('寄养编号','id',data?.id||'','text','例如：B001')}<div class="field"><label>宠物</label>${petSelect(data?.petId||petId)}</div>${fld('开始时间','startDate',data?.startDate||'','datetime-local')}${fld('结束时间','endDate',data?.endDate||'','datetime-local')}${fld('每日价格','pricePerDay',data?.pricePerDay??'','number','例如：120')}<div class="field"><label>状态</label><select data-k="status"><option ${data?.status==='预约中'?'selected':''}>预约中</option><option ${data?.status==='寄养中'?'selected':''}>寄养中</option><option ${data?.status==='已完成'?'selected':''}>已完成</option></select></div></div>`}if(data)modalBody.querySelector('[data-k="id"]').disabled=true;modalSave.onclick=async()=>{const d=getData();const apiUrl=kind==='wash'?'/api/washes':'/api/boardings';await api(data?`${apiUrl}/${encodeURIComponent(data.id)}`:apiUrl,{method:data?'PUT':'POST',body:JSON.stringify(d)});closeModal();await go(kind)}}
function openSimple(kind,data=null){modal.classList.remove('hidden');if(kind==='customer'){modalTitle.textContent=data?'编辑客户':'新增客户';modalBody.innerHTML=`<div class="grid2">${fld('客户编号','id',data?.id||'','text','例如：C001')}${fld('姓名','name',data?.name||'','text','例如：张先生')}${fld('电话','phone',data?.phone||'','text','请输入联系电话')}${fld('地址','address',data?.address||'','text','请输入地址')}</div>`}else{modalTitle.textContent=data?'编辑订单':'新增订单';modalBody.innerHTML=`<div class="grid2">${fld('订单编号','id',data?.id||'','text','例如：O001')}<div class="field"><label>宠物</label>${petSelect(data?.petId||'')}</div>${fld('服务类型','serviceType',data?.serviceType||'','text','例如：美容')}${fld('金额','price',data?.price??'','number','例如：100')}${fld('创建时间','createTime',data?.createTime||'','datetime-local')}<div class="field"><label>状态</label><select data-k="status"><option ${data?.status==='待完成'?'selected':''}>待完成</option><option ${data?.status==='进行中'?'selected':''}>进行中</option><option ${data?.status==='已完成'?'selected':''}>已完成</option></select></div></div>`}modalSub.textContent='';if(data)modalBody.querySelector('[data-k="id"]').disabled=true;modalSave.onclick=async()=>{const d=getData();const u=kind==='customer'?'/api/customers':'/api/orders';await api(data?`${u}/${encodeURIComponent(data.id)}`:u,{method:data?'PUT':'POST',body:JSON.stringify(d)});closeModal();await go(kind)}}
function editRow(kind,data){if(kind==='pet')openPet(data);else if(kind==='wash'||kind==='boarding')openService(kind,'',data);else openSimple(kind,data)}
async function removeRow(kind,id){if(!confirm('确定删除这条记录吗？'))return;const u={pet:'/api/pets',wash:'/api/washes',boarding:'/api/boardings',customer:'/api/customers',order:'/api/orders'}[kind];await api(`${u}/${encodeURIComponent(id)}`,{method:'DELETE'});await go(kind)}
function closeModal(){modal.classList.add('hidden')}
boot();
</script>
</body>
</html>
