<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PetCare Pro</title><style>
:root{--navy:#0f172a;--blue:#2563eb;--blue2:#1d4ed8;--bg:#f6f8fc;--line:#e2e8f0;--muted:#64748b;--text:#0f172a;--white:#fff;--danger:#dc2626;--ok:#15803d}*{box-sizing:border-box}body{margin:0;font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text)}button,input,select{font:inherit}.hidden{display:none!important}.login{min-height:100vh;display:grid;grid-template-columns:1.05fr .95fr;background:linear-gradient(135deg,#0b1220,#172554)}.hero{padding:8vw;color:#fff;display:flex;flex-direction:column;justify-content:center}.hero h1{font-size:clamp(36px,5vw,66px);line-height:1.08;margin:18px 0}.hero p{max-width:620px;color:#cbd5e1;font-size:18px;line-height:1.8}.kicker{font-size:12px;letter-spacing:2px;color:#93c5fd}.login-side{display:grid;place-items:center;padding:28px}.card-login{width:min(460px,94vw);background:#fff;border-radius:20px;padding:34px;box-shadow:0 30px 80px #0004}.brand{display:flex;align-items:center;gap:12px;font-size:21px;font-weight:800}.brandmark{width:42px;height:42px;display:grid;place-items:center;border-radius:12px;background:#dbeafe}.field{display:grid;gap:7px;margin-top:15px}.field label{font-size:13px;font-weight:700;color:#334155}.field input,.field select{width:100%;border:1px solid #cbd5e1;border-radius:10px;padding:12px 13px;background:#fff;outline:none}.field input:focus,.field select:focus{border-color:#2563eb;box-shadow:0 0 0 3px #2563eb18}.hint{font-size:12px;color:#94a3b8}.btn{border:0;border-radius:10px;padding:11px 15px;cursor:pointer;font-weight:700}.primary{background:var(--blue);color:white}.primary:hover{background:var(--blue2)}.secondary{background:#eef2f7;color:#334155}.danger{background:#fee2e2;color:#b91c1c}.login-actions{display:flex;gap:10px;margin-top:22px}.msg{margin-top:14px;color:#b91c1c;font-size:14px}.shell{display:grid;grid-template-columns:250px 1fr;min-height:100vh}.side{background:var(--navy);color:white;padding:22px 16px;position:sticky;top:0;height:100vh}.side .brand{padding:0 8px 22px;border-bottom:1px solid #ffffff14}.nav{display:grid;gap:6px;margin-top:22px}.nav button{border:0;background:transparent;color:#cbd5e1;text-align:left;padding:12px 14px;border-radius:10px;cursor:pointer}.nav button.active,.nav button:hover{background:#2563eb;color:white}.main{min-width:0}.topbar{height:76px;background:white;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:5}.topbar h1{font-size:22px;margin:0}.topbar small{color:var(--muted)}.content{padding:26px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.stat,.panel{background:white;border:1px solid #e6eaf0;border-radius:14px;box-shadow:0 4px 14px #0f172a0b}.stat{padding:22px}.stat b{font-size:30px;display:block;margin-top:8px}.panel{padding:20px;margin-top:18px}.toolbar{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-bottom:16px}.toolbar .left{display:flex;gap:10px;align-items:center}.search{border:1px solid #dbe2ea;border-radius:9px;padding:10px 12px;width:min(300px,48vw)}table{width:100%;border-collapse:collapse}th,td{padding:13px 10px;border-bottom:1px solid #edf0f4;text-align:left;font-size:14px}th{color:#475569;background:#f8fafc}.actions{display:flex;gap:7px}.tag{display:inline-block;padding:4px 9px;border-radius:999px;background:#e0ecff;color:#1d4ed8;font-size:12px}.empty{text-align:center;color:#94a3b8;padding:32px}.modal-bg{position:fixed;inset:0;background:#0f172a88;display:grid;place-items:center;padding:20px;z-index:20}.modal{width:min(620px,96vw);max-height:90vh;overflow:auto;background:#fff;border-radius:16px;padding:22px}.modal h3{margin:0 0 6px}.modal-sub{color:#64748b;font-size:13px;margin-bottom:14px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.modal-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:20px}.hamb{display:none}.pet-pill{font-weight:700;color:#1e40af}.notice{padding:12px 14px;background:#eff6ff;border:1px solid #bfdbfe;border-radius:10px;color:#1e40af;font-size:13px;margin-bottom:14px}@media(max-width:900px){.login{grid-template-columns:1fr}.hero{display:none}.shell{grid-template-columns:1fr}.side{position:fixed;left:-260px;z-index:15;width:250px;transition:.2s}.side.open{left:0}.hamb{display:inline-flex}.stats{grid-template-columns:1fr 1fr}.content{padding:16px}.topbar{padding:0 16px}.toolbar{align-items:flex-start;flex-direction:column}.toolbar .left{width:100%;flex-wrap:wrap}.search{width:100%}.panel{overflow:auto}}@media(max-width:560px){.stats{grid-template-columns:1fr}.grid2{grid-template-columns:1fr}.login-side{padding:14px}.card-login{padding:24px}th,td{white-space:nowrap}}
</style></head><body>
<div id="login" class="login"><section class="hero"><span class="kicker">PETCARE BUSINESS CONSOLE</span><h1>宠物门店运营<br>一站式管理</h1><p>宠物档案、客户资料、洗护、寄养与服务订单自动联动，让门店日常操作更接近真实业务系统。</p></section><section class="login-side"><div class="card-login"><div class="brand"><div class="brandmark">🐾</div>PetCare Pro</div><h2>欢迎回来</h2><p style="color:#64748b">登录后进入门店业务控制台</p><div class="field"><label>用户名</label><input id="username" placeholder="例如：store_admin"></div><div class="field"><label>密码</label><input id="password" type="password" placeholder="请输入密码"></div><div class="login-actions"><button class="btn primary" onclick="doLogin()">登录</button><button class="btn secondary" onclick="registerUser()">注册账号</button></div><div id="loginMsg" class="msg"></div></div></section></div>
<div id="app" class="shell hidden"><aside id="side" class="side"><div class="brand"><div class="brandmark">🐾</div><span>PetCare Pro</span></div><nav id="nav" class="nav"></nav></aside><main class="main"><header class="topbar"><div style="display:flex;align-items:center;gap:12px"><button class="btn secondary hamb" onclick="side.classList.toggle('open')">☰</button><div><h1 id="pageTitle">运营概览</h1><small id="pageSub">查看门店核心业务数据</small></div></div><div style="display:flex;align-items:center;gap:10px"><span id="who" style="font-weight:700"></span><button class="btn secondary" onclick="logout()">退出</button></div></header><section id="content" class="content"></section></main></div>
<div id="modal" class="modal-bg hidden" onclick="if(event.target===this)closeModal()"><div class="modal"><h3 id="modalTitle"></h3><div id="modalSub" class="modal-sub"></div><div id="modalBody"></div><div class="modal-actions"><button class="btn secondary" onclick="closeModal()">取消</button><button class="btn primary" id="modalSave">保存</button></div></div></div>
<script>
const navItems=[['dashboard','运营概览'],['pet','宠物管理'],['customer','客户管理'],['wash','洗护管理'],['boarding','寄养管理'],['order','服务订单']];
const commonModules={customer:{label:'客户管理',sub:'维护客户联系资料',api:'/api/customers',cols:[['id','编号'],['name','姓名'],['phone','电话'],['address','地址']]},order:{label:'服务订单',sub:'洗护和寄养新增后自动进入订单列表',api:'/api/orders',cols:[['id','订单编号'],['petName','宠物'],['serviceType','服务类型'],['price','金额'],['createTime','创建时间'],['status','状态']]}};
let current='dashboard',cache=[],pets=[];
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
async function api(url,opt={}){const r=await fetch(url,{credentials:'include',headers:{'Content-Type':'application/json',...(opt.headers||{})},...opt});if(r.status===401){showLogin();throw Error('请重新登录')}if(!r.ok)throw Error((await r.text()).replace(/^"|"$/g,'')||'操作失败');const t=await r.text();return t?JSON.parse(t):null}
async function refreshPets(){pets=await api('/api/pets')}
async function boot(){try{const me=await api('/api/auth/me');who.textContent=me.name;showApp();renderNav();await refreshPets();go('dashboard')}catch{showLogin()}}
function showLogin(){login.classList.remove('hidden');app.classList.add('hidden')}function showApp(){login.classList.add('hidden');app.classList.remove('hidden')}
async function doLogin(){loginMsg.textContent='';try{const r=await api('/api/auth/login',{method:'POST',body:JSON.stringify({name:username.value,password:password.value})});who.textContent=r.name;showApp();renderNav();await refreshPets();go('dashboard')}catch(e){loginMsg.style.color='#b91c1c';loginMsg.textContent='用户名或密码错误'}}
async function registerUser(){loginMsg.textContent='';try{await api('/api/auth/register',{method:'POST',body:JSON.stringify({name:username.value,password:password.value})});loginMsg.style.color='#15803d';loginMsg.textContent='注册成功，请点击登录'}catch(e){loginMsg.style.color='#b91c1c';loginMsg.textContent=e.message}}
async function logout(){await fetch('/api/auth/logout',{method:'POST',credentials:'include'});showLogin()}
function renderNav(){nav.innerHTML=navItems.map(([k,l])=>`<button class="${current===k?'active':''}" onclick="go('${k}')">${l}</button>`).join('')}
async function go(k){current=k;side.classList.remove('open');renderNav();if(k==='dashboard'){pageTitle.textContent='运营概览';pageSub.textContent='查看门店核心业务数据';const d=await api('/api/dashboard');content.innerHTML=`<div class="stats">${[['宠物档案',d.pets],['客户数量',d.customers],['寄养中',d.boardings],['服务订单',d.orders]].map(x=>`<div class="stat"><span style="color:#64748b">${x[0]}</span><b>${x[1]}</b></div>`).join('')}</div><div class="panel"><h3>业务联动</h3><p style="color:#64748b;line-height:1.8">宠物档案会自动作为洗护与寄养的可选宠物。新增洗护或寄养后，系统会自动创建对应服务订单。</p></div>`;return}
if(k==='pet'){pageTitle.textContent='宠物管理';pageSub.textContent='维护宠物档案，并同步给洗护与寄养使用';cache=await api('/api/pets');pets=cache;renderTable('pet');return}
if(k==='wash'){pageTitle.textContent='洗护管理';pageSub.textContent='从宠物档案中直接选择宠物并创建洗护服务';await refreshPets();cache=await api('/api/washes');renderTable('wash');return}
if(k==='boarding'){pageTitle.textContent='寄养管理';pageSub.textContent='选择已有宠物，登记寄养时间与每日费用';await refreshPets();cache=await api('/api/boardings');renderTable('boarding');return}
const m=commonModules[k];pageTitle.textContent=m.label;pageSub.textContent=m.sub;cache=await api(m.api);renderTable(k)}
function getCols(k){if(k==='pet')return [['id','编号'],['name','名称'],['age','年龄'],['breed','品种'],['gender','性别'],['weight','体重(kg)']];if(k==='wash')return [['id','编号'],['petName','宠物'],['name','洗护项目'],['price','价格'],['time','预计时长']];if(k==='boarding')return [['id','编号'],['petName','宠物'],['startDate','开始时间'],['endDate','结束时间'],['pricePerDay','每日价格'],['status','状态']];return commonModules[k].cols}
function renderTable(k){content.innerHTML=`<div class="panel"><div class="toolbar"><div class="left"><input id="search" class="search" placeholder="搜索当前列表" oninput="filterTable()"><button class="btn primary" onclick="openEdit()">＋ 新增</button></div><span style="color:#64748b">共 ${cache.length} 条</span></div><div id="tableWrap"></div></div>`;draw(cache)}
function filterTable(){const q=search.value.toLowerCase();draw(cache.filter(x=>JSON.stringify(x).toLowerCase().includes(q)))}
function draw(list){const cols=getCols(current);tableWrap.innerHTML=list.length?`<table><thead><tr>${cols.map(c=>`<th>${c[1]}</th>`).join('')}<th>操作</th></tr></thead><tbody>${list.map(x=>`<tr>${cols.map(c=>`<td>${c[0]==='petName'?`<span class="pet-pill">${esc(x[c[0]]||x.petId)}</span>`:esc(x[c[0]])}</td>`).join('')}<td class="actions"><button class="btn secondary" onclick='openEdit(${JSON.stringify(x).replace(/'/g,"&#39;")})'>编辑</button><button class="btn danger" onclick="removeItem('${esc(x.id)}')">删除</button></td></tr>`).join('')}</tbody></table>`:`<div class="empty">暂无数据</div>`}
function petSelect(value=''){return `<select data-k="petId"><option value="">请选择宠物</option>${pets.map(p=>`<option value="${esc(p.id)}" ${p.id===value?'selected':''}>${esc(p.name)}（${esc(p.id)} · ${esc(p.breed||'未填品种')}）</option>`).join('')}</select>`}
function fld(label,key,value='',type='text',placeholder='',hint=''){return `<div class="field"><label>${label}</label><input data-k="${key}" type="${type}" value="${esc(value)}" placeholder="${esc(placeholder)}">${hint?`<span class="hint">${hint}</span>`:''}</div>`}
function openEdit(data=null){modal.classList.remove('hidden');modalTitle.textContent=data?'编辑记录':'新增记录';modalSub.textContent='';let html='';
if(current==='pet'){modalTitle.textContent=data?'编辑宠物档案':'新增宠物档案';modalSub.textContent='保存后会自动同步到洗护和寄养的宠物选择列表。';html=`<div class="grid2">${fld('宠物编号','id',data?.id,'text','例如：PET001','建议使用唯一编号')}${fld('宠物名称','name',data?.name,'text','例如：豆豆')}${fld('年龄','age',data?.age,'number','例如：3','请输入整数年龄')}${fld('体重(kg)','weight',data?.weight,'number','例如：6.5')}</div><div class="grid2"><div class="field"><label>品种</label><input data-k="breed" list="breedList" value="${esc(data?.breed||'')}" placeholder="可选择，也可以自己输入"><datalist id="breedList"><option>泰迪</option><option>比熊</option><option>金毛</option><option>拉布拉多</option><option>柯基</option><option>柴犬</option><option>博美</option><option>边牧</option><option>英短</option><option>美短</option><option>布偶</option><option>橘猫</option></datalist><span class="hint">可从常用品种中选择，也支持自由填写</span></div><div class="field"><label>性别</label><select data-k="gender"><option value="">请选择性别</option><option ${data?.gender==='公'?'selected':''}>公</option><option ${data?.gender==='母'?'selected':''}>母</option><option ${data?.gender==='未知'?'selected':''}>未知</option></select><span class="hint">例如：公 / 母</span></div></div>`}
else if(current==='wash'){modalTitle.textContent=data?'编辑洗护服务':'新增洗护服务';modalSub.textContent='宠物来自宠物管理；新增后会自动生成一条服务订单。';html=`<div class="notice">选择宠物后，订单会自动记录对应宠物，不需要重复录入。</div><div class="grid2">${fld('洗护编号','id',data?.id,'text','例如：WASH001')}<div class="field"><label>宠物</label>${petSelect(data?.petId)}<span class="hint">列表与宠物管理实时同步</span></div>${fld('洗护项目','name',data?.name,'text','例如：基础洗护')}${fld('价格','price',data?.price,'number','例如：88')}${fld('预计时长','time',data?.time,'text','例如：60分钟')}</div>`}
else if(current==='boarding'){modalTitle.textContent=data?'编辑寄养记录':'新增寄养记录';modalSub.textContent='宠物来自宠物管理；新增后系统按天数计算金额并生成服务订单。';html=`<div class="notice">寄养金额 = 寄养天数 × 每日价格，新增后自动进入服务订单。</div><div class="grid2">${fld('寄养编号','id',data?.id,'text','例如：BOARD001')}<div class="field"><label>宠物</label>${petSelect(data?.petId)}<span class="hint">请选择已建档宠物</span></div>${fld('开始时间','startDate',toLocal(data?.startDate),'datetime-local')}${fld('结束时间','endDate',toLocal(data?.endDate),'datetime-local')}${fld('每日价格','pricePerDay',data?.pricePerDay,'number','例如：68')}<div class="field"><label>状态</label><select data-k="status">${['预约中','进行中','已完成','已取消'].map(s=>`<option ${data?.status===s?'selected':''}>${s}</option>`).join('')}</select></div></div>`}
else if(current==='customer'){modalTitle.textContent=data?'编辑客户':'新增客户';html=`<div class="grid2">${fld('客户编号','id',data?.id,'text','例如：CUS001')}${fld('客户姓名','name',data?.name,'text','例如：张女士')}${fld('联系电话','phone',data?.phone,'text','例如：13800000000')}${fld('地址','address',data?.address,'text','例如：滨海新区')}</div>`}
else{modalTitle.textContent=data?'编辑订单':'新增订单';html=`<div class="grid2">${fld('订单编号','id',data?.id,'text','例如：ORD001')}<div class="field"><label>宠物</label>${petSelect(data?.petId)}</div>${fld('服务类型','serviceType',data?.serviceType,'text','例如：其他服务')}${fld('金额','price',data?.price,'number','例如：120')}${fld('创建时间','createTime',toLocal(data?.createTime),'datetime-local')}<div class="field"><label>状态</label><select data-k="status">${['待完成','进行中','已完成','已取消'].map(s=>`<option ${data?.status===s?'selected':''}>${s}</option>`).join('')}</select></div></div>`}
modalBody.innerHTML=html;if(data)modalBody.querySelector('[data-k="id"]')?.setAttribute('disabled','');modalSave.onclick=()=>saveItem(data?.id)}
function toLocal(v){if(!v)return'';return String(v).replace(' ','T').slice(0,16)}function closeModal(){modal.classList.add('hidden')}
function collect(){const d={};modalBody.querySelectorAll('[data-k]').forEach(i=>d[i.dataset.k]=i.value);return d}
async function saveItem(id){const d=collect();let apiPath=current==='pet'?'/api/pets':current==='wash'?'/api/washes':current==='boarding'?'/api/boardings':commonModules[current].api;try{await api(id?`${apiPath}/${encodeURIComponent(id)}`:apiPath,{method:id?'PUT':'POST',body:JSON.stringify(d)});closeModal();await go(current)}catch(e){alert(e.message)}}
async function removeItem(id){if(!confirm('确定删除这条记录吗？'))return;let apiPath=current==='pet'?'/api/pets':current==='wash'?'/api/washes':current==='boarding'?'/api/boardings':commonModules[current].api;try{await api(`${apiPath}/${encodeURIComponent(id)}`,{method:'DELETE'});await go(current)}catch(e){alert(e.message)}}
boot();
</script></body></html>
