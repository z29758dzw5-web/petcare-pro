<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>短信登录 - PetCare Pro</title>
<style>
:root{--blue:#2563eb;--blue2:#1d4ed8;--text:#0f172a;--muted:#64748b;--line:#cbd5e1}
*{box-sizing:border-box}body{margin:0;font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif;background:linear-gradient(135deg,#0b1220,#172554);min-height:100vh;display:grid;place-items:center;padding:20px}
.card{width:min(460px,94vw);background:#fff;border-radius:20px;padding:34px;box-shadow:0 30px 80px #0004}
.brand{display:flex;align-items:center;gap:12px;font-size:21px;font-weight:800}.brandmark{width:42px;height:42px;display:grid;place-items:center;border-radius:12px;background:#dbeafe}
h2{margin:24px 0 6px}.muted{color:var(--muted);margin:0 0 18px}.field{display:grid;gap:7px;margin-top:15px}.field label{font-size:13px;font-weight:700;color:#334155}.field input{width:100%;border:1px solid var(--line);border-radius:10px;padding:12px 13px;outline:none}.field input:focus{border-color:var(--blue);box-shadow:0 0 0 3px #2563eb18}
.row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:end}.btn{border:0;border-radius:10px;padding:11px 14px;cursor:pointer;font-weight:700}.primary{background:var(--blue);color:#fff}.primary:hover{background:var(--blue2)}.secondary{background:#eef2f7;color:#334155}.full{width:100%;margin-top:20px}.msg{margin-top:14px;font-size:14px}.back{margin-top:18px;text-align:center}.back a{color:var(--blue);text-decoration:none;font-weight:700}
@media(max-width:520px){.card{padding:24px}.row{grid-template-columns:1fr}.row .btn{width:100%}}
</style>
</head>
<body>
<div class="card">
  <div class="brand"><div class="brandmark">🐾</div>PetCare Pro</div>
  <h2>短信登录</h2>
  <p class="muted">使用注册时绑定的手机号和验证码登录</p>
  <div class="field"><label>手机号</label><input id="phone" inputmode="tel" placeholder="请输入注册手机号"></div>
  <div class="row">
    <div class="field"><label>验证码</label><input id="code" inputmode="numeric" placeholder="6位验证码"></div>
    <button class="btn secondary" onclick="sendCode()">获取验证码</button>
  </div>
  <button class="btn primary full" onclick="smsLogin()">短信登录</button>
  <div id="msg" class="msg"></div>
  <div class="back"><a href="/">← 返回密码登录</a></div>
</div>
<script>
async function request(url,body){
  const r=await fetch(url,{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  const t=await r.text(); let data=null; try{data=t?JSON.parse(t):null}catch{data=t}
  if(!r.ok) throw new Error(typeof data==='string'?data:(data?.message||'操作失败'));
  return data;
}
function show(text,ok=false){msg.style.color=ok?'#15803d':'#b91c1c';msg.textContent=text}
async function sendCode(){
  show('');
  try{
    const r=await request('/api/auth/send-code',{phone:phone.value});
    if(r.demoCode){code.value=r.demoCode;show('演示验证码：'+r.demoCode+'（已自动填入）',true)}
    else show(r.message||'验证码已发送',true);
  }catch(e){show(e.message)}
}
async function smsLogin(){
  show('');
  try{
    await request('/api/auth/sms-login',{phone:phone.value,code:code.value});
    show('登录成功，正在进入控制台…',true);
    setTimeout(()=>location.href='/',500);
  }catch(e){show(e.message)}
}
</script>
</body>
</html>
